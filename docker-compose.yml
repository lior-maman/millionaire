# Runs all three services together: MongoDB, FastAPI backend, React frontend.
# Usage:  docker compose up --build
# Then open http://localhost:8081

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # No host port exposed by default; backend reaches it over the internal
    # network. Uncomment to inspect from the host with a Mongo client.
    # ports:
    #   - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "8000"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: millionaire
      # Seed the two activities automatically on first run (only if DB is empty).
      SEED_ON_STARTUP: "true"
      # Login tokens + first admin. Put real values in a root .env file
      # (gitignored). The dev defaults below are for local use only.
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-secret-not-for-prod}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@local.test}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-now}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Expose the API on the host too, for Swagger at http://localhost:8000/docs
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PORT: "8080"
      # Point nginx at the local backend container, not production.
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  mongo_data:
