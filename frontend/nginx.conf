server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://millionaire-backend-251573632162.me-west1.run.app/api/;
        proxy_ssl_server_name on;
    }
}