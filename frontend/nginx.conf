server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA: fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (name from docker-compose).
    #
    # Use Docker's embedded DNS (127.0.0.11) and resolve the backend host via a
    # variable. This makes nginx resolve the name AT REQUEST TIME rather than at
    # startup, so nginx boots even if the backend container isn't ready yet
    # (avoids "host not found in upstream" crash-loops).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
